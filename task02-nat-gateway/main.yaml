AWSTemplateFormatVersion: '2010-09-09'
Description: Task 2 – NAT Gateway (Elastic IP + NAT GW + private route)

Parameters:
  ProjectName: { Type: String, Default: moodle }
  Environment: { Type: String, Default: dev, AllowedValues: [dev, test, prod] }
  Student: { Type: String, Default: ZweLwin }
  Course: { Type: String, Default: Practical-IaC-Deployment }
  Task: { Type: String, Default: Task02-NatGateway }

Resources:
  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-nat-eip"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt ElasticIP.AllocationId
      SubnetId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-PublicSubnet1Id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-nat-gw"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-PrivateRouteTableId"
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

Outputs:
  NatGatewayId:
    Value: !Ref NatGateway
    Export:
      Name: !Sub "${ProjectName}-${Environment}-NatGatewayId"

  ElasticIp:
    Value: !Ref ElasticIP
    Export:
      Name: !Sub "${ProjectName}-${Environment}-NatEip"
