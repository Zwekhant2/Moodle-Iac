AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Task 1 – Networking for Moodle LMS (Zwe Lwin).
  Creates a VPC (10.25.92.0/22), 2x Public + 2x Private subnets across 2 AZs,
  Internet Gateway, route tables. NAT will be added in Task 9.

Parameters:
  ProjectName: { Type: String, Default: moodle, Description: Project short name }
  Environment:  { Type: String, Default: dev, AllowedValues: [dev, test, prod] }
  Student:      { Type: String, Default: ZweLwin }
  Course:       { Type: String, Default: Practical-IaC-Deployment }
  Implementation:{ Type: String, Default: AWS }
  Task:         { Type: String, Default: Task01-Networking }
  DeploymentType:{ Type: String, Default: PoC, AllowedValues: [PoC, Basic, Full] }

  VpcCidr:
    Type: String
    Default: 10.25.92.0/22
    AllowedPattern: "(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}"
    Description: VPC CIDR from spreadsheet.
  PublicSubnet1Cidr:  { Type: String, Default: 10.25.92.0/24 }
  PublicSubnet2Cidr:  { Type: String, Default: 10.25.93.0/24 }
  PrivateSubnet1Cidr: { Type: String, Default: 10.25.94.0/24 }
  PrivateSubnet2Cidr: { Type: String, Default: 10.25.95.0/24 }

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name; Value: !Sub "${ProjectName}-${Environment}-vpc"
        - { Key: Course, Value: !Ref Course }
        - { Key: Implementation, Value: !Ref Implementation }
        - { Key: Task, Value: !Ref Task }
        - { Key: Student, Value: !Ref Student }
        - { Key: DeploymentType, Value: !Ref DeploymentType }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name; Value: !Sub "${ProjectName}-${Environment}-igw"
        - { Key: Course, Value: !Ref Course }
        - { Key: Implementation, Value: !Ref Implementation }
        - { Key: Task, Value: !Ref Task }
        - { Key: Student, Value: !Ref Student }
        - { Key: DeploymentType, Value: !Ref DeploymentType }

  AttachIgw:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name; Value: !Sub "${ProjectName}-${Environment}-rtb-public"
        - { Key: Course, Value: !Ref Course }
        - { Key: Implementation, Value: !Ref Implementation }
        - { Key: Task, Value: !Ref Task }
        - { Key: Student, Value: !Ref Student }
        - { Key: DeploymentType, Value: !Ref DeploymentType }

  DefaultRouteToIgw:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
    DependsOn: AttachIgw

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name; Value: !Sub "${ProjectName}-${Environment}-rtb-private"
        - { Key: Course, Value: !Ref Course }
        - { Key: Implementation, Value: !Ref Implementation }
        - { Key: Task, Value: !Ref Task }
        - { Key: Student, Value: !Ref Student }
        - { Key: DeploymentType, Value: !Ref DeploymentType }

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name; Value: !Sub "${ProjectName}-${Environment}-public-a"
        - { Key: Tier, Value: public }
        - { Key: Course, Value: !Ref Course }
        - { Key: Implementation, Value: !Ref Implementation }
        - { Key: Task, Value: !Ref Task }
        - { Key: Student, Value: !Ref Student }
        - { Key: DeploymentType, Value: !Ref DeploymentType }

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name; Value: !Sub "${ProjectName}-${Environment}-public-b"
        - { Key: Tier, Value: public }
        - { Key: Course, Value: !Ref Course }
        - { Key: Implementation, Value: !Ref Implementation }
        - { Key: Task, Value: !Ref Task }
        - { Key: Student, Value: !Ref Student }
        - { Key: DeploymentType, Value: !Ref DeploymentType }

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name; Value: !Sub "${ProjectName}-${Environment}-private-a"
        - { Key: Tier, Value: private }
        - { Key: Course, Value: !Ref Course }
        - { Key: Implementation, Value: !Ref Implementation }
        - { Key: Task, Value: !Ref Task }
        - { Key: Student, Value: !Ref Student }
        - { Key: DeploymentType, Value: !Ref DeploymentType }

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name; Value: !Sub "${ProjectName}-${Environment}-private-b"
        - { Key: Tier, Value: private }
        - { Key: Course, Value: !Ref Course }
        - { Key: Implementation, Value: !Ref Implementation }
        - { Key: Task, Value: !Ref Task }
        - { Key: Student, Value: !Ref Student }
        - { Key: DeploymentType, Value: !Ref DeploymentType }

  AssocPublicSubnet1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  AssocPublicSubnet2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  AssocPrivateSubnet1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  AssocPrivateSubnet2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export: { Name: !Sub "${AWS::StackName}-VpcId" }
  PublicSubnet1Id:
    Description: Public Subnet 1 ID (AZ1)
    Value: !Ref PublicSubnet1
    Export: { Name: !Sub "${AWS::StackName}-PublicSubnet1Id" }
  PublicSubnet2Id:
    Description: Public Subnet 2 ID (AZ2)
    Value: !Ref PublicSubnet2
    Export: { Name: !Sub "${AWS::StackName}-PublicSubnet2Id" }
  PrivateSubnet1Id:
    Description: Private Subnet 1 ID (AZ1)
    Value: !Ref PrivateSubnet1
    Export: { Name: !Sub "${AWS::StackName}-PrivateSubnet1Id" }
  PrivateSubnet2Id:
    Description: Private Subnet 2 ID (AZ2)
    Value: !Ref PrivateSubnet2
    Export: { Name: !Sub "${AWS::StackName}-PrivateSubnet2Id" }
  PublicRouteTableId:
    Description: Public Route Table ID
    Value: !Ref PublicRouteTable
  PrivateRouteTableId:
    Description: Private Route Table ID
    Value: !Ref PrivateRouteTable
